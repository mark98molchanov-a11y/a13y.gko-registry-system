name: 🔄 Автообновление cadastrovy_nomer из Gist

on:
  repository_dispatch:
    types:
      - nspd_sync_completed
  
  workflow_dispatch:
    inputs:
      gist_id:
        description: 'ID Gist с номерами НСПД'
        required: false
        default: '9f6e65a18e94b61a6b7a96389e9109c5'
  
  schedule:
    - cron: '0 * * * *'

jobs:
  update-cadastrovy-nomer:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      actions: write
      # ❌ УДАЛИТЕ СТРОКУ: metadata: read
    
    steps:
      - name: 📝 Информация о запуске
        run: |
          echo "🔄 Запуск обновления cadastrovy_nomer"
          echo "📌 Тип события: ${{ github.event_name }}"
          echo "📌 Gist ID: ${{ github.event.client_payload.gist_id || github.event.inputs.gist_id || '9f6e65a18e94b61a6b7a96389e9109c5' }}"
      
      - name: 📥 Checkout репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🐍 Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 📦 Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl
      
      - name: 🔄 Загрузка связей из Gist
        id: load_gist
        run: |
          python scripts/load_from_gist.py
        env:
          GIST_ID: ${{ github.event.client_payload.gist_id || github.event.inputs.gist_id || '9f6e65a18e94b61a6b7a96389e9109c5' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 📊 Обновление CSV
        id: update_csv
        run: |
          python scripts/update_csv_from_gist_auto.py
      
      - name: 📤 Проверка изменений
        id: check_changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/deals_clean.csv
          git diff --staged --quiet || echo "CHANGED=true" >> $GITHUB_ENV
      
      - name: 📤 Commit и Push
        if: env.CHANGED == 'true'
        run: |
          git commit -m "🔄 Автообновление cadastrovy_nomer из Gist [skip ci]"
          git push
      
      - name: 📊 Статистика обновления
        if: env.CHANGED == 'true'
        run: |
          echo "### ✅ Обновление выполнено!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Показатель | Значение |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Дата обновления | $(date '+%Y-%m-%d %H:%M:%S') |" >> $GITHUB_STEP_SUMMARY
          echo "| Источник | Gist: ${{ github.event.client_payload.gist_id || github.event.inputs.gist_id || '9f6e65a18e94b61a6b7a96389e9109c5' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Файл | data/deals_clean.csv |" >> $GITHUB_STEP_SUMMARY
      
      - name: ⚠️ Нет изменений
        if: env.CHANGED != 'true'
        run: |
          echo "ℹ️ Нет изменений для коммита (cadastrovy_nomer уже актуален)" >> $GITHUB_STEP_SUMMARY
