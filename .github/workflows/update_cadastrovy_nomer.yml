name: 🔄 Автообновление cadastrovy_nomer из Gist

on:
  # ✅ Запуск вручную из интерфейса GitHub
  workflow_dispatch:
  
  # ✅ Запуск по расписанию (каждые 30 минут)
  schedule:
    - cron: '*/30 * * * *'
  
  # ✅ Запуск при push в основную ветку (если меняется deals_clean.csv)
  push:
    branches:
      - main
      - master
    paths:
      - 'data/deals_clean.csv'

jobs:
  update-cadastrovy-nomer:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      actions: write
    
    steps:
      - name: 📥 Checkout репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🐍 Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 📦 Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl
      
      - name: 🔄 Загрузка связей из Gist
        id: load_gist
        run: |
          python scripts/load_from_gist.py
        env:
          GIST_ID: ${{ secrets.NSPD_GIST_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 📊 Обновление CSV
        id: update_csv
        run: |
          python scripts/update_csv_from_gist_auto.py
        env:
          GIST_ID: ${{ secrets.NSPD_GIST_ID }}
      
      - name: 📤 Проверка изменений и Commit
        id: commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/deals_clean.csv
          git diff --staged --quiet || echo "CHANGED=true" >> $GITHUB_ENV
      
      - name: 📤 Push изменений
        if: env.CHANGED == 'true'
        run: |
          git commit -m "🔄 Автообновление cadastrovy_nomer из Gist [skip ci]"
          git push
      
      - name: 📊 Статистика обновления
        if: env.CHANGED == 'true'
        run: |
          echo "### 📊 Статистика обновления" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Показатель | Значение |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Дата обновления | $(date '+%Y-%m-%d %H:%M:%S') |" >> $GITHUB_STEP_SUMMARY
          echo "| Источник | Gist: ${{ secrets.NSPD_GIST_ID }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Файл | data/deals_clean.csv |" >> $GITHUB_STEP_SUMMARY
