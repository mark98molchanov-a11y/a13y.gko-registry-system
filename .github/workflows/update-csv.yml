name: Update CSV from Vercel Blob

on:
  workflow_dispatch:
    inputs:
      blob_url:
        description: 'URL CSV в Vercel Blob'
        required: true
        type: string

jobs:
  update-csv:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download CSV from Vercel Blob
        run: |
          echo "📥 Скачивание CSV из Vercel Blob..."
          echo "URL: ${{ github.event.inputs.blob_url }}"
          
          curl -L -o deals_clean.csv "${{ github.event.inputs.blob_url }}"
          
          if [ ! -f deals_clean.csv ] || [ ! -s deals_clean.csv ]; then
            echo "❌ Ошибка: CSV не скачался"
            exit 1
          fi
          
          echo "📏 Размер CSV: $(du -h deals_clean.csv | cut -f1)"

      - name: Get Release ID
        id: get_release
        run: |
          echo "📦 Получение информации о релизе v1.0.0..."
          RELEASE_INFO=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v1.0.0")
          
          RELEASE_ID=$(echo $RELEASE_INFO | jq -r '.id')
          echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT
          echo "✅ Релиз найден, ID: $RELEASE_ID"

      - name: Delete old asset if exists
        run: |
          echo "🗑️ Удаление старого deals_clean.csv..."
          
          ASSET_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/${{ steps.get_release.outputs.release_id }}/assets" \
            | jq -r '.[] | select(.name=="deals_clean.csv") | .id')
          
          if [ -n "$ASSET_ID" ] && [ "$ASSET_ID" != "null" ]; then
            curl -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/assets/$ASSET_ID"
            echo "✅ Старый asset удален"
          else
            echo "ℹ️ Старого asset не найдено"
          fi

      - name: Upload CSV to Release
        run: |
          echo "📤 Загрузка CSV в релиз..."
          
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @deals_clean.csv \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ steps.get_release.outputs.release_id }}/assets?name=deals_clean.csv"
          
          echo "✅ CSV загружен!"
