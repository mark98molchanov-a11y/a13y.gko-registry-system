name: ML Price Prediction API

on:
  repository_dispatch:
    types: [ml-prediction-request]
  workflow_dispatch:
    inputs:
      area:
        description: 'Площадь (м²)'
        required: true
        type: string
      build_year:
        description: 'Год постройки'
        required: false
        type: string
        default: '2015'
      object_type:
        description: 'Тип объекта'
        required: true
        type: choice
        options:
          - Здание
          - Помещение
          - Сооружение
          - Земельный участок
      permitted_use:
        description: 'ВРИ (для земельных участков)'
        required: false
        type: string
        default: ''
      address:
        description: 'Адрес'
        required: false
        type: string
        default: ''
      kadastr:
        description: 'Кадастровый номер'
        required: false
        type: string
        default: ''
      wall_material:
        description: 'Материал стен'
        required: false
        type: string
        default: ''
      name:
        description: 'Наименование объекта'
        required: false
        type: string
        default: ''

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('ml-models/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            
      - name: Install dependencies
        run: |
          cd ml-models
          pip install -r requirements.txt
          
      - name: Train models (if not exists)
        run: |
          cd ml-models
          if [ ! -f "model_buildings.pkl" ] || [ ! -f "model_land.pkl" ]; then
            echo "Training models..."
            python train_model.py
          else
            echo "Models already exist, skipping training"
          fi
          
      - name: Run prediction
        id: predict
        run: |
          cd ml-models
          
          AREA="${{ github.event.client_payload.area || github.event.inputs.area }}"
          BUILD_YEAR="${{ github.event.client_payload.build_year || github.event.inputs.build_year || 2015 }}"
          OBJECT_TYPE="${{ github.event.client_payload.object_type || github.event.inputs.object_type }}"
          PERMITTED_USE="${{ github.event.client_payload.permitted_use || github.event.inputs.permitted_use || '' }}"
          ADDRESS="${{ github.event.client_payload.address || github.event.inputs.address || '' }}"
          KADASTR="${{ github.event.client_payload.kadastr || github.event.inputs.kadastr || '' }}"
          WALL_MATERIAL="${{ github.event.client_payload.wall_material || github.event.inputs.wall_material || '' }}"
          NAME="${{ github.event.client_payload.name || github.event.inputs.name || '' }}"
          
          echo "📊 Запуск оценки для: $OBJECT_TYPE, площадь: $AREA м²"
          
          python predict.py "$AREA" "$BUILD_YEAR" "$OBJECT_TYPE" "$PERMITTED_USE" "$ADDRESS" "$KADASTR" "$WALL_MATERIAL" "$NAME" > prediction_result.json
          
          echo "✅ Оценка завершена"
          echo "result=$(cat prediction_result.json)" >> $GITHUB_OUTPUT
          
      - name: Save prediction result
        uses: actions/upload-artifact@v4
        with:
          name: prediction-result-${{ github.run_id }}
          path: ml-models/prediction_result.json
          retention-days: 7
          
      - name: Output summary
        run: |
          echo "### 📊 Результат оценки" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat ml-models/prediction_result.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
