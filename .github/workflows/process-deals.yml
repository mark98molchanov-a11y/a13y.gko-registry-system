name: Process Deals Data

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Create data directory
        run: mkdir -p data
          
      - name: Download CSV from latest release
        run: |
          RELEASE_URL=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | \
            grep -o '"browser_download_url": "[^"]*all_deals_itog.csv[^"]*"' | \
            head -1 | sed 's/"browser_download_url": "//' | sed 's/"//')
          
          if [ -n "$RELEASE_URL" ]; then
            echo "📥 Downloading: $RELEASE_URL"
            curl -L -o data/all_deals_itog.csv "$RELEASE_URL"
          else
            echo "❌ CSV file not found in releases"
            exit 1
          fi
          
      - name: Process deals data
        run: |
          python scripts/process_deals.py
          
      - name: Get latest release info
        id: release_info
        run: |
          # Получаем информацию о последнем релизе
          RELEASE_DATA=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest)
          UPLOAD_URL=$(echo "$RELEASE_DATA" | grep -o '"upload_url": "[^"]*"' | sed 's/"upload_url": "//' | sed 's/"//' | sed 's/{?name,label}//')
          RELEASE_ID=$(echo "$RELEASE_DATA" | grep -o '"id": [0-9]*' | head -1 | sed 's/"id": //')
          
          echo "upload_url=$UPLOAD_URL" >> $GITHUB_OUTPUT
          echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT
          
      - name: Compress JSON file
        run: |
          # Сжимаем JSON для уменьшения размера
          gzip -c data/deals_by_quarter.json > data/deals_by_quarter.json.gz
          echo "✅ JSON сжат: $(du -h data/deals_by_quarter.json.gz | cut -f1)"
          
      - name: Upload JSON to release
        run: |
          UPLOAD_URL="${{ steps.release_info.outputs.upload_url }}"
          
          if [ -z "$UPLOAD_URL" ]; then
            echo "❌ No release found. Please create a release first."
            exit 1
          fi
          
          # Загружаем сжатый JSON как asset
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @data/deals_by_quarter.json.gz \
            "$UPLOAD_URL?name=deals_by_quarter.json.gz&label=Данные%20по%20сделкам%20(JSON)"
          
          echo "✅ JSON загружен в релиз"
          
      - name: Upload CSV to release (optional, for backup)
        run: |
          UPLOAD_URL="${{ steps.release_info.outputs.upload_url }}"
          
          # Загружаем CSV как backup
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @data/all_deals_itog.csv \
            "$UPLOAD_URL?name=all_deals_itog_backup.csv&label=Резервная%20копия%20CSV"
          
          echo "✅ CSV загружен как backup"
