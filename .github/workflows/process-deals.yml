name: Process Deals Data

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write  # <--- ЭТО КЛЮЧЕВОЕ ДОБАВЛЕНИЕ

jobs:
  process:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Create data directory
        run: mkdir -p data
          
      - name: Download CSV from latest release
        run: |
          RELEASE_URL=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | \
            grep -o '"browser_download_url": "[^"]*all_deals_itog.csv[^"]*"' | \
            head -1 | sed 's/"browser_download_url": "//' | sed 's/"//')
          
          if [ -n "$RELEASE_URL" ]; then
            echo "📥 Downloading: $RELEASE_URL"
            curl -L -o data/all_deals_itog.csv "$RELEASE_URL"
          else
            echo "❌ CSV file not found in releases"
            exit 1
          fi
          
      - name: Process deals data
        run: |
          python scripts/process_deals.py
          
      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/deals_by_quarter.json
          
          if git diff --staged --quiet; then
            echo "ℹ️ No changes to commit"
          else
            git commit -m "🤖 Auto-update deals data"
            git push
          fi
