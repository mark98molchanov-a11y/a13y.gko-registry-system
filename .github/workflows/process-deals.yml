name: Process Deals Data

on:
  # Запуск при создании нового релиза
  release:
    types: [published]
  # Или вручную из интерфейса
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Create data directory
        run: mkdir -p data
          
      - name: Download CSV from latest release
        run: |
          # Получаем URL последнего релиза с CSV
          RELEASE_URL=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | \
            grep -o '"browser_download_url": "[^"]*all_deals_itog.csv[^"]*"' | \
            head -1 | sed 's/"browser_download_url": "//' | sed 's/"//')
          
          if [ -n "$RELEASE_URL" ]; then
            echo "📥 Скачиваем файл: $RELEASE_URL"
            curl -L -o data/all_deals_itog.csv "$RELEASE_URL"
          else
            echo "❌ CSV файл не найден в релизах"
            exit 1
          fi
          
      - name: Process deals data
        run: |
          python scripts/process_deals.py
          
      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/deals_by_quarter.json
          git diff --staged --quiet || git commit -m "🤖 Автообновление данных о сделках"
          git push
