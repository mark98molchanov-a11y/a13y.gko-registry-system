name: 🗺️ Deploy Map with LFS

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Позволяет запускать вручную

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    runs-on: ubuntu-latest
    
    steps:
      # 1. Клонируем репозиторий с LFS
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
      
      # 2. Проверяем, что LFS файл скачался
      - name: Verify LFS file
        run: |
          echo "📁 Проверка файла data/yanao_hierarchical_web.geojson"
          ls -lh data/yanao_hierarchical_web.geojson
          head -c 200 data/yanao_hierarchical_web.geojson
      
      # 3. Копируем LFS файл в корень (для GitHub Pages)
      - name: Copy LFS file to root
        run: |
          cp data/yanao_hierarchical_web.geojson .
          echo "✅ Файл скопирован в корень"
      
      # 4. Создаем map.html в корне (если его нет)
      - name: Ensure map.html exists
        run: |
          if [ ! -f map.html ]; then
            echo "❌ map.html не найден в корне"
            exit 1
          fi
          echo "✅ map.html найден"
      
      # 5. Настраиваем GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      # 6. Загружаем артефакты
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      
      # 7. Деплоим на GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
