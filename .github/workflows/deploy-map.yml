name: 🗺️ Deploy Map with LFS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: Verify LFS file
        run: |
          echo "📁 Проверка файла data/yanao_hierarchical_web.geojson"
          ls -lh data/yanao_hierarchical_web.geojson || echo "Файл не найден"
          if [ -f data/yanao_hierarchical_web.geojson ]; then
            head -c 200 data/yanao_hierarchical_web.geojson
          fi
      
      - name: Copy LFS file to root
        run: |
          if [ -f data/yanao_hierarchical_web.geojson ]; then
            cp data/yanao_hierarchical_web.geojson .
            echo "✅ Файл скопирован в корень"
          else
            echo "⚠️ Файл data/yanao_hierarchical_web.geojson не найден"
          fi
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
