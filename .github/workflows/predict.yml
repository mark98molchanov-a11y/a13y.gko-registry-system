name: ML Price Prediction

on:
  workflow_dispatch:
    inputs:
      area:
        description: 'Площадь (м²)'
        required: true
      build_year:
        description: 'Год постройки'
        required: false
        default: '2015'
      object_type:
        description: 'Тип объекта'
        required: false
        type: choice
        options:
          - Земельный участок
          - Здание
          - Помещение
          - Сооружение
        default: 'Здание'
      permitted_use:
        description: 'ВРИ — только для земельных участков'
        required: false
        default: ''
      wall_material:
        description: 'Материал стен — для зданий/помещений/сооружений'
        required: false
        default: ''
      name:
        description: 'Наименование — для зданий/помещений/сооружений'
        required: false
        default: ''
      address:
        description: 'Адрес (город)'
        required: false
        default: ''
      kadastr:
        description: 'Кадастровый номер'
        required: false
        default: ''

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          cd ml-models
          pip install pandas catboost scikit-learn openpyxl xlrd
          
      - name: Train model
        run: |
          cd ml-models
          python train_model.py || echo "Models ready"
          
      - name: Predict price
        id: predict
        run: |
          cd ml-models
          python predict.py "${{ inputs.area }}" "${{ inputs.build_year }}" '${{ inputs.object_type }}' '${{ inputs.permitted_use }}' '${{ inputs.address }}' '${{ inputs.kadastr }}' '${{ inputs.wall_material }}' '${{ inputs.name }}' > prediction_result.json
          echo "result=$(cat prediction_result.json)" >> $GITHUB_OUTPUT
          
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: prediction-result
          path: ml-models/prediction_result.json
          
      - name: Show result
        run: |
          echo "## Результат оценки" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat ml-models/prediction_result.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
